# Nextcloud — drive.june8th.eu.org
#
# Host nginx terminates TLS and proxies to 127.0.0.1:8090 (Nextcloud Apache
# container). client_max_body_size 0 lets Nextcloud apply its own per-user
# upload limit. proxy_request_buffering off + a long read timeout are
# required for chunked uploads (the E2EE app requires chunked uploads to
# be disabled in config, but normal large uploads still happen over PHP's
# move_uploaded_file() and nginx would buffer them to disk otherwise).

# HTTP -> HTTPS
server {
    listen 80;
    server_name drive.june8th.eu.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name drive.june8th.eu.org;

    ssl_certificate     /etc/letsencrypt/live/june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/june8th.eu.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # WebDAV clients (Finder, Explorer) use PROPFIND/PROPPATCH — nginx needs
    # to forward these verbs unchanged. Limit the body for ordinary GETs;
    # the explicit 0 above removes the limit for PUT/uploads.
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_redirect off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_redirect off;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # long-running uploads / WebDAV transfers
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_connect_timeout 60s;
    }
}
