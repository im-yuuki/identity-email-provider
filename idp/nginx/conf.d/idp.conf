# Authentik — idp.june8th.eu.org

# HTTP -> HTTPS
server {
    listen 80;
    server_name idp.june8th.eu.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name idp.june8th.eu.org;

    ssl_certificate     /etc/letsencrypt/live/june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/june8th.eu.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    # OIDC discovery endpoints need CORS.
    # Bulwark's browser-side discovery tries /.well-known/oauth-authorization-server
    # first; Authentik answers 404 without CORS headers, the browser blocks the
    # response and the openid-configuration fallback never runs (SSO stays broken).
    location ^~ /.well-known/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $authentik_up http://authentik:9000;
        proxy_pass $authentik_up;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
        add_header Access-Control-Allow-Methods "GET,HEAD,OPTIONS" always;
        add_header Access-Control-Max-Age       "86400" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # X-Forwarded-* set globally in nginx.conf
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $authentik_up http://authentik:9000;
        proxy_pass $authentik_up;
        proxy_redirect off;
    }
}
