# Authentik — idp.june8th.eu.org
#
# Drop this file into /etc/nginx/conf.d/ on the VPS that runs the `idp`
# stack. The certificate path assumes the cert was issued with
# --cert-name june8th.eu.org (so every host has the same path).
#
# Required upstream globals (the main nginx.conf you write yourself must set):
#   proxy_http_version 1.1;
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_set_header X-Forwarded-Host  $host;
#   proxy_set_header X-Forwarded-Port  $server_port;
# The Authentik vhost sets `trusted_proxies = 127.0.0.1`, so the loopback
# is the only trusted upstream.

# HTTP -> HTTPS
server {
    listen 80;
    server_name idp.june8th.eu.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name idp.june8th.eu.org;

    ssl_certificate     /etc/letsencrypt/live/june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/june8th.eu.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    # OIDC discovery endpoints need CORS.
    # Bulwark's browser-side discovery tries /.well-known/oauth-authorization-server
    # first; Authentik answers 404 without CORS headers, the browser blocks the
    # response and the openid-configuration fallback never runs (SSO stays broken).
    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_redirect off;
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Headers "Authorization,Content-Type" always;
        add_header Access-Control-Allow-Methods "GET,HEAD,OPTIONS" always;
        add_header Access-Control-Max-Age       "86400" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_redirect off;
    }
}
