name: vault

volumes:
  vaultwarden-data:
  nginx-cache:

services:
  # ---------- Edge ----------
  nginx:
    image: nginx:stable-alpine
    container_name: vault-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - ${CERTBOT_WEBROOT:-/var/www/certbot}:/var/www/certbot:ro
      - nginx-cache:/var/cache/nginx
    depends_on:
      - vaultwarden
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------- Password manager ----------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vault-vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: ${VAULTWARDEN_DOMAIN:-https://vault.june8th.eu.org}
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      # Permit first OIDC signup for the domain; SSO_ONLY disables password login.
      SIGNUPS_ALLOWED: ${VAULTWARDEN_SIGNUPS_ALLOWED:-true}
      SIGNUPS_DOMAINS_WHITELIST: ${VAULTWARDEN_SIGNUPS_DOMAINS_WHITELIST:-june8th.eu.org}
      SHOW_PASSWORD_HINT: "false"
      SSO_ENABLED: "true"
      SSO_ONLY: "true"
      SSO_AUTHORITY: "${IDP_URL:-https://idp.june8th.eu.org}/application/o/${VAULTWARDEN_SSO_CLIENT_ID:-vaultwarden}/"
      SSO_CLIENT_ID: ${VAULTWARDEN_SSO_CLIENT_ID:-vaultwarden}
      SSO_CLIENT_SECRET: ${VAULTWARDEN_SSO_SECRET}
      # SMTP_HOST: "stalwart"
      # SMTP_PORT: 465
      # SMTP_SECURITY: "force_tls"
      # SMTP_USERNAME: "no-reply@june8th.eu.org"
      # SMTP_PASSWORD: "<svc-mail password>"
      # MAIL_FROM: "no-reply@june8th.eu.org"
    volumes:
      - vaultwarden-data:/data
