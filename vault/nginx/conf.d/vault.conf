# Vaultwarden — vault.june8th.eu.org

# HTTP -> HTTPS
server {
    listen 80;
    server_name vault.june8th.eu.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name vault.june8th.eu.org;

    ssl_certificate     /etc/letsencrypt/live/june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/june8th.eu.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    # block admin panel trickle-attack surface: change !example to your IP on VPS if wanted
    # location /admin { allow 203.0.113.0/24; deny all; proxy_pass http://vaultwarden:80; }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_redirect off;
    }
}
