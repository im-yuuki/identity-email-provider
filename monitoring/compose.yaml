name: monitoring

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:

services:
  # ---------- Metrics ----------
  prometheus:
    image: prom/prometheus:latest
    container_name: monitoring-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      # accepts remote-write pushes from other projects
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    # the host nginx proxies the remote-write endpoint to 127.0.0.1:9090
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    container_name: monitoring-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      # the whole directory: scripts/10-render-alertmanager.sh writes the
      # rendered config here before the stack is started
      - ./alertmanager:/etc/alertmanager:ro
      - alertmanager-data:/alertmanager
    # reachable through an SSH tunnel for debugging
    ports:
      - "127.0.0.1:9093:9093"

  # ---------- Dashboards ----------
  grafana:
    image: grafana/grafana:latest
    container_name: monitoring-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.june8th.eu.org}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.june8th.eu.org}
      GF_SERVER_ENFORCE_DOMAIN: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # alerting lives in Prometheus + Alertmanager, not in Grafana
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    # the host nginx terminates TLS and proxies to 127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # ---------- Host / container metrics ----------
  node-exporter:
    image: prom/node-exporter:latest
    container_name: monitoring-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      # \z (RE2 end-of-text) instead of $ — no $ escaping needed in compose
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)(/|\z)
    volumes:
      - /:/host:ro,rslave
    pid: host

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: monitoring-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
