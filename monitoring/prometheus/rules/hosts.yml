groups:
  - name: targets
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.instance }} is down"
          description: "Job {{ $labels.job }} cannot scrape {{ $labels.instance }} for 5 minutes."

  - name: host
    rules:
      - alert: NodeFilesystemSpaceFillingUp
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 < 20
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is filling up"
          description: "Only {{ $value | printf \"%.1f\" }}% of the filesystem is left."

      - alert: NodeFilesystemAlmostOutOfSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}) * 100 < 10
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Disk {{ $labels.mountpoint }} on {{ $labels.instance }} is almost full"
          description: "Only {{ $value | printf \"%.1f\" }}% of the filesystem is left."

      - alert: NodeCPUHigh
        expr: (1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CPU on {{ $labels.instance }} is above 90%"
          description: "CPU usage has been {{ $value | printf \"%.1f\" }}% for 10 minutes."

      - alert: NodeMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory on {{ $labels.instance }} is above 90%"
          description: "Memory usage has been {{ $value | printf \"%.1f\" }}% for 10 minutes."

      - alert: NodeLoadHigh
        expr: node_load15 / count without (cpu) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Load average on {{ $labels.instance }} is high"
          description: "Load per core has been {{ $value | printf \"%.2f\" }} for 15 minutes."

      - alert: HostClockSkew
        expr: abs(node_timex_offset_seconds) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Clock skew on {{ $labels.instance }}"
          description: "The clock differs by {{ $value | printf \"%.1f\" }}s from NTP."

  - name: prometheus
    rules:
      - alert: PrometheusRuleEvaluationFailures
        expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus cannot evaluate its rules"
          description: "Rule evaluation failed {{ $value }} times in the last 5 minutes."

      - alert: PrometheusRemoteWriteBacklog
        expr: prometheus_remote_storage_samples_pending > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Remote-write queue is backing up"
          description: "{{ $value }} samples are still waiting to be sent."

      - alert: PrometheusTSDBTooLarge
        expr: prometheus_tsdb_head_series / prometheus_tsdb_head_max_series > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus is running out of series"
          description: "The head block uses {{ $value | printf \"%.1f\" }}% of its series limit."
