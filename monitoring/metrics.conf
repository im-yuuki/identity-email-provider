# Prometheus remote-write endpoint — metrics.june8th.eu.org
#
# Other projects push their metrics to https://metrics.june8th.eu.org/api/v1/write
# with the basic-auth pair from .env (METRICS_BASIC_AUTH_USER / _PASSWORD).
# Everything else is hidden: the Prometheus UI is not public, Grafana is the
# front door.
#
# Drop this file into /etc/nginx/conf.d/ on the VPS that runs the
# `monitoring` stack. The certificate path assumes the cert was issued
# with --cert-name june8th.eu.org.
#
# Before reloading nginx for the first time, create the basic-auth file:
#   sudo apt install -y apache2-utils
#   METRICS_PASS=$(openssl rand -hex 24)
#   sudo htpasswd -cB /etc/nginx/auth/metrics.htpasswd metrics     # type/pass $METRICS_PASS
#   echo "$METRICS_PASS"   # save as METRICS_BASIC_AUTH_PASSWORD in the projects' .env

# HTTP -> HTTPS
server {
    listen 80;
    server_name metrics.june8th.eu.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name metrics.june8th.eu.org;

    ssl_certificate     /etc/letsencrypt/live/june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/june8th.eu.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    # remote-write receiver (Prometheus must run with --web.enable-remote-write-receiver)
    location = /api/v1/write {
        auth_basic "metrics";
        auth_basic_user_file /etc/nginx/auth/metrics.htpasswd;

        # optional: restrict the pushes to the IPs of the projects that push
        # allow 203.0.113.10;
        # deny all;

        proxy_pass http://127.0.0.1:9090;
        proxy_redirect off;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # everything else is closed
    location / {
        return 404;
    }
}
