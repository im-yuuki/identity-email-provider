# Grafana — grafana.june8th.eu.org

# HTTP -> HTTPS
server {
    listen 80;
    server_name grafana.june8th.eu.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name grafana.june8th.eu.org;

    ssl_certificate     /etc/letsencrypt/live/june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/june8th.eu.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $grafana_up http://grafana:3000;
        proxy_pass $grafana_up;
        proxy_redirect off;
        # live dashboards keep a websocket open
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
