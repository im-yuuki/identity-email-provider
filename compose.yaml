volumes:
  bulwark-config:
  bulwark-state:
  postgres-data:
  authentik-media:
  authentik-templates:
  stalwart-data:
  stalwart-etc:
  ldap-data:
  ldap-config:
  vaultwarden-data:
  redis-data:
  nginx-cache:

services:
  # ---------- Edge ----------
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LETSENCRYPT_DIR:-./tls}:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------- Identity---------- OpenLDAP + Authelia (authentik stack removed 2026-10-23, dev data disposable) ----------
  openldap:
    image: osixia/openldap:2.6.15-alpha   # 'stable' tag is a broken legacy image (osixia#605); maintainer points to 2.6.x-alpha
    container_name: openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: "june8th"
      LDAP_DOMAIN: "june8th.eu.org"
      LDAP_BASE_DN: "dc=june8th,dc=eu,dc=org"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_CONFIG_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      LDAP_TLS: "false"   # plain LDAP :389, internal docker net only
      # 2.6.x-alpha image variables (LDAP_* legacy vars are ignored by this image)
      OPENLDAP_BOOTSTRAP_SUFFIX: "dc=june8th,dc=eu,dc=org"
      OPENLDAP_BOOTSTRAP_ORGANIZATION: "june8th"
      OPENLDAP_BOOTSTRAP_CONFIG_ROOT_PASSWORD_HASHED: ${OPENLDAP_CONFIG_ROOT_PW_HASHED}
      OPENLDAP_BOOTSTRAP_DATA_ROOT_PASSWORD_HASHED: ${OPENLDAP_DATA_ROOT_PW_HASHED}
      # memberof overlay on first boot (Authelia + Stalwart read group membership)
      OPENLDAP_BOOTSTRAP_MEMBEROF: "true"
      # image default listens on 3890/6360 — force standard ports for the stack
      OPENLDAP_URLS: "ldap://:389/"
    volumes:
      # bundled base/ renders the root DN from env; we only inject user data
      - ./openldap/ldif/custom:/container/services/openldap-bootstrap/assets/ldif/data/custom
      - ldap-data:/var/lib/openldap/openldap-data
      - ldap-config:/etc/openldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 389 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  authelia:
    image: authelia/authelia:4.39.20
    container_name: authelia
    restart: unless-stopped
    # default cwd is /app; point it at the mounted config explicitly
    command: ['--config', '/config/configuration.yml']
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
      AUTHELIA_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET: ${AUTHELIA_JWT_SECRET}
    volumes:
      - ./authelia:/config
    depends_on:
      - openldap

  # ---------- Mail ----------
  stalwart:
    image: ghcr.io/stalwartlabs/stalwart:v0.16.27-alpine
    container_name: stalwart
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
    environment:
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_ADMIN_PASSWORD}"
      STALWART_PUBLIC_URL: "https://mx.june8th.eu.org"
    volumes:
      - ${LETSENCRYPT_DIR:-./tls}:/etc/letsencrypt:ro
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ---------- Webmail ----------
  bulwark:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: bulwark
    restart: unless-stopped
    environment:
      JMAP_SERVER_URL: http://stalwart:8080
      ADMIN_PASSWORD: ${BULWARK_ADMIN_PASSWORD}
      SESSION_SECRET: ${BULWARK_SESSION_SECRET}
      # SSO via Authelia (client "bulwark" in authelia/configuration.yml, redirect /auth/callback)
      OAUTH_ENABLED: "true"
      OAUTH_ONLY: "true"
      OAUTH_CLIENT_ID: "bulwark"
      OAUTH_CLIENT_SECRET: ${BULWARK_OAUTH_SECRET}
      OAUTH_ISSUER_URL: "https://idp.june8th.eu.org"
      # login page automatically starts the server-side SSO flow (doc: guides/embedded-sso)
      AUTO_SSO_ENABLED: "true"
    extra_hosts:
      # the FQDN of the Authelia issuer must resolve from inside the container
      # (host /etc/hosts dev mapping otherwise wins): send it to nginx via the host gateway
      - "idp.june8th.eu.org:host-gateway"
    volumes:
      - bulwark-config:/app/data/admin
      - bulwark-state:/app/data/admin-state

