volumes:
  bulwark-config:
  bulwark-state:
  postgres-data:
  authentik-media:
  authentik-templates:
  stalwart-data:
  stalwart-etc:
  vaultwarden-data:
  redis-data:
  nginx-cache:

services:
  # ---------- Edge ----------
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LETSENCRYPT_DIR:-./tls}:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------- Identity ----------
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik:
    image: ghcr.io/goauthentik/server:2026.8.4
    container_name: authentik
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASSWORD}
      AUTHENTIK_POSTGRESQL__USE_PGPOOL: "false"
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP__PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP__USERNAME: akadmin
      AUTHENTIK_BOOTSTRAP__EMAIL: admin@june8th.eu.org
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"127.0.0.1\", 9000), 3).close()'"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.8.4
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASSWORD}
      AUTHENTIK_POSTGRESQL__USE_PGPOOL: "false"
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP__PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP__USERNAME: akadmin
      AUTHENTIK_BOOTSTRAP__EMAIL: admin@june8th.eu.org
    volumes:
      - authentik-media:/media
      - authentik-templates:/templates
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # wait for the server (migrations complete) instead of racing it for the
      # database migration lock -> no "waiting to acquire database lock" /
      # "workerstatus does not exist" startup noise; first boot ~30s slower
      authentik:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------- Mail ----------
  stalwart:
    image: ghcr.io/stalwartlabs/stalwart:v0.16.27-alpine
    container_name: stalwart
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
    environment:
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_ADMIN_PASSWORD}"
      STALWART_PUBLIC_URL: "https://mx.june8th.eu.org"
    volumes:
      - ${LETSENCRYPT_DIR:-./tls}:/etc/letsencrypt:ro
      - stalwart-etc:/etc/stalwart
      - stalwart-data:/var/lib/stalwart
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  # ---------- Webmail ----------
  bulwark:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: bulwark
    restart: unless-stopped
    environment:
      JMAP_SERVER_URL: http://stalwart:8080
      ADMIN_PASSWORD: ${BULWARK_ADMIN_PASSWORD}
      SESSION_SECRET: ${BULWARK_SESSION_SECRET}
      # OAUTH_ENABLED: "true"
      # OAUTH_ONLY: "true"
      # OAUTH_CLIENT_ID: "bulwark"
      # OAUTH_CLIENT_SECRET: "<generated>"
      # OAUTH_ISSUER_URL: "https://idp.june8th.eu.org/application/o/bulwark/"
    volumes:
      - bulwark-config:/app/data/admin
      - bulwark-state:/app/data/admin-state

