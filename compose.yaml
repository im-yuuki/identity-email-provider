volumes:
  bulwark-config:
  bulwark-state:
  authentik-db-data:
  authentik-files:
  authentik-templates-data:
  # Retained for any prior install; unused by current Authentik.
  redis-data:
  stalwart-data:
  stalwart-etc:
  vaultwarden-data:
  nginx-cache:

services:
  # ---------- Edge ----------
  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - nginx-cache:/var/cache/nginx
    networks:
      default:
        aliases:
          - idp.june8th.eu.org
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 3s
      retries: 3

  # ---------- Identity ----------
  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DB:-authentik}
      POSTGRES_USER: ${PG_USER:-authentik}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - authentik-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  authentik:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.4}
    container_name: authentik
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASSWORD}
      AUTHENTIK_POSTGRESQL__USE_PGPOOL: "false"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@june8th.eu.org
    volumes:
      - authentik-files:/data
      - authentik-templates-data:/templates
    shm_size: 512mb
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"127.0.0.1\", 9000), 3).close()'"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.4}
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASSWORD}
      AUTHENTIK_POSTGRESQL__USE_PGPOOL: "false"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_EMAIL: admin@june8th.eu.org
    volumes:
      - authentik-files:/data
      - authentik-templates-data:/templates
    shm_size: 512mb
    depends_on:
      postgres:
        condition: service_healthy
      authentik:
        condition: service_healthy

  authentik-ldap:
    image: ghcr.io/goauthentik/ldap:${AUTHENTIK_TAG:-2026.8.4}
    container_name: authentik-ldap
    profiles: ["ldap"]
    restart: unless-stopped
    environment:
      AUTHENTIK_HOST: http://authentik:9000
      AUTHENTIK_TOKEN: ${AUTHENTIK_LDAP_TOKEN:-}
    depends_on:
      authentik:
        condition: service_healthy

  # ---------- Mail ----------
  stalwart:
    image: ghcr.io/stalwartlabs/stalwart:v0.16.27-alpine
    container_name: stalwart
    user: "0:0"
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "995:995"
    environment:
      STALWART_RECOVERY_ADMIN: "admin:${STALWART_ADMIN_PASSWORD}"
      STALWART_LDAP_BIND_PASSWORD: ${STALWART_LDAP_BIND_PASSWORD}
      STALWART_PUBLIC_URL: "https://mx.june8th.eu.org"
    volumes:
      - ${LETSENCRYPT_DIR:-/etc/letsencrypt}:/etc/letsencrypt:ro
      - stalwart-etc:/etc/stalwart
      - ./stalwart/config.json:/etc/stalwart/config.json:ro
      - stalwart-data:/var/lib/stalwart
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 5

  bulwark:
    image: ghcr.io/bulwarkmail/webmail:latest
    container_name: bulwark
    restart: unless-stopped
    environment:
      JMAP_SERVER_URL: http://stalwart:8080
      ADMIN_PASSWORD: ${BULWARK_ADMIN_PASSWORD}
      SESSION_SECRET: ${BULWARK_SESSION_SECRET}
      # Create the matching OAuth2/OIDC provider in Authentik.
      OAUTH_ENABLED: "true"
      OAUTH_ONLY: "true"
      OAUTH_CLIENT_ID: "bulwark"
      OAUTH_CLIENT_SECRET: ${BULWARK_OAUTH_SECRET}
      OAUTH_ISSUER_URL: "https://idp.june8th.eu.org/application/o/bulwark/"
      # login page automatically starts the server-side SSO flow (doc: guides/embedded-sso)
      AUTO_SSO_ENABLED: "true"
    volumes:
      - bulwark-config:/app/data/admin
      - bulwark-state:/app/data/admin-state

  # ---------- Secrets / Vault ----------
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.june8th.eu.org
      ADMIN_TOKEN: ${VAULTWARDEN_ADMIN_TOKEN}
      # Permit first OIDC signup for the domain; SSO_ONLY disables password login.
      SIGNUPS_ALLOWED: "true"
      SIGNUPS_DOMAINS_WHITELIST: "june8th.eu.org"
      SHOW_PASSWORD_HINT: "false"
      SSO_ENABLED: "true"
      SSO_ONLY: "true"
      SSO_AUTHORITY: "https://idp.june8th.eu.org/application/o/vaultwarden/"
      SSO_CLIENT_ID: "vaultwarden"
      SSO_CLIENT_SECRET: ${VAULTWARDEN_SSO_SECRET}
      # SMTP_HOST: "stalwart"
      # SMTP_PORT: 465
      # SMTP_SECURITY: "force_tls"
      # SMTP_USERNAME: "no-reply@june8th.eu.org"
      # SMTP_PASSWORD: "<svc-mail password>"
      # MAIL_FROM: "no-reply@june8th.eu.org"
    volumes:
      - vaultwarden-data:/data
