# Host nginx configuration (installed on the VPS, not in Docker).
#
# Managed by the identity-email-provider repository — do not edit on the host,
# change nginx/nginx.conf in the repo and run scripts/20-install-nginx.sh.
#
# TLS is terminated here: the container backends are published on 127.0.0.1
# only and never touch the internet directly.
#
# Installed by nginx/install.sh — it copies this file to /etc/nginx/nginx.conf
# and symlinks the vhosts of the stack into /etc/nginx/conf.d/.

user www-data;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # upstreams are a compromise buffer for large bodies (attachments)
    client_max_body_size  100m;
    client_body_buffer_size 128k;

    gzip  on;
    gzip_types text/plain text/css application/javascript application/json application/x-font-ttf font/woff font/woff2 image/svg+xml;
    gzip_min_length 1024;

    # --- proxy helper defaults ---
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_read_timeout   120s;
    proxy_connect_timeout 10s;

    # HTTP/2 — generated by nginx/install.sh (nginx >= 1.25.1 supports the
    # `http2` directive, older versions fall back to HTTP/1.1)
    include /etc/nginx/http2.conf;

    # websocket forward (global here: proxy_set_header inheritance is
    # all-or-nothing, so the vhosts must NOT set them locally)
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- default server ----------------------------------------------------
    # Unknown Host headers are dropped. The ACME location is served here so
    # `certbot --webroot` works without touching the vhosts.
    # The TLS default server uses a self-signed placeholder certificate
    # (generated by nginx/install.sh) — the real certificates live in the
    # vhosts.
    server {
        listen 80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 444;
        }
    }

    server {
        listen 443 ssl default_server;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/default.crt;
        ssl_certificate_key /etc/nginx/ssl/default.key;

        return 444;
    }

    include /etc/nginx/conf.d/*.conf;
}
