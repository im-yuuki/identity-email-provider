user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;
    server_tokens   off;

    # upstreams are a compromise buffer for large bodies (attachments)
    client_max_body_size  100m;
    client_body_buffer_size 128k;

    gzip  on;
    gzip_types text/plain text/css application/javascript application/json application/x-font-ttf font/woff font/woff2 image/svg+xml;
    gzip_min_length 1024;

    # --- proxy helper defaults ---
    proxy_http_version 1.1;
    # Docker's embedded DNS; makes upstreams resolve at request time,
    # so nginx still starts (and restarts) when a backend is missing
    resolver 127.0.0.11 valid=10s ipv6=off;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;
    proxy_read_timeout   120s;
    proxy_connect_timeout 10s;

    # websocket helper
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    include /etc/nginx/conf.d/*.conf;
}
