# Stalwart HTTP — mx.june8th.eu.org (JMAP: /api + /.well-known/jmap, admin UI: /admin)
# Raw mail ports (25/465/587/993/995) are published directly by the stalwart container, not through nginx.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name mx.june8th.eu.org;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    # limit admin UI by IP when you go to VPS: (optional)
    # location /admin { allow 203.0.113.0/24; deny all; proxy_pass http://stalwart:8080; }

    location / {
        proxy_pass http://stalwart:8080;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
        # JMAP pushes can be long-lived
        proxy_read_timeout 300s;
    }
}
