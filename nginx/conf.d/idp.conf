# Authentik — idp.june8th.eu.org
# Embedded LDAP outpost lives inside the server container on :389/:636 (internal net only)

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name idp.june8th.eu.org;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    # X-Forwarded-* set globally in nginx.conf
    location / {
        proxy_pass http://authentik:9000;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Authentik-Host $host;
        proxy_redirect off;
    }
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    return 444;   # drop anything not matching our vhosts
}
