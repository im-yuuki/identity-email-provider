# Authentik — idp.june8th.eu.org

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name idp.june8th.eu.org;

    ssl_certificate     /etc/letsencrypt/live/june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/june8th.eu.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    # X-Forwarded-* set globally in nginx.conf
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $authentik_up http://authentik:9000;
        proxy_pass $authentik_up;
        proxy_redirect off;
    }
}

server {
    listen 80 default_server;
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/june8th.eu.org/privkey.pem;

    return 444;   # drop anything not matching our vhosts
}
