# Vaultwarden — vault.june8th.eu.org

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name vault.june8th.eu.org;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    # block admin panel trickle-attack surface: change !example to your IP on VPS if wanted
    # location /admin { allow 203.0.113.0/24; deny all; proxy_pass http://vaultwarden:80; }

    location / {
        proxy_pass http://vaultwarden:80;
        proxy_redirect off;
    }
}

# redirect plain HTTP to HTTPS (vault only; idp/mail keep :80 too for OIDC acme-less flows)
# NOTE: on ports 80 the idp.conf catch-all drops unknown Hosts, so mail/vault must also
# listen on 80 above. That stays until you set up a global redirect policy.
