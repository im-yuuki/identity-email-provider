# Bulwark webmail — mail.june8th.eu.org  (JMAP client for Stalwart)

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name mail.june8th.eu.org;

    ssl_certificate     /etc/letsencrypt/live/mx.june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mx.june8th.eu.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $bulwark_up  http://bulwark:3000;
        proxy_pass $bulwark_up;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_redirect off;
    }
}
