# Bulwark webmail — mail.june8th.eu.org  (JMAP client for Stalwart)

# HTTP -> HTTPS
server {
    listen 80;
    server_name mail.june8th.eu.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mail.june8th.eu.org;

    ssl_certificate     /etc/letsencrypt/live/june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/june8th.eu.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect off;
    }
}
