# Stalwart HTTP — mx.june8th.eu.org
# (JMAP: /api + /.well-known/jmap, admin UI: /admin)
#
# Drop this file into /etc/nginx/conf.d/ on the VPS that runs the `mail`
# stack. The certificate path assumes the cert was issued with
# --cert-name june8th.eu.org.
#
# Raw mail ports (25/465/587/993/995) are published directly by the
# stalwart container, not through nginx.

# HTTP -> HTTPS
server {
    listen 80;
    server_name mx.june8th.eu.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mx.june8th.eu.org;

    ssl_certificate     /etc/letsencrypt/live/june8th.eu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/june8th.eu.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;

    # limit admin UI by IP when you go to VPS: (optional)
    # location /admin { allow 203.0.113.0/24; deny all; proxy_pass http://127.0.0.1:8080; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # JMAP pushes can be long-lived
        proxy_read_timeout 300s;
    }
}
